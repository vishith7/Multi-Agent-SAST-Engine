injection:
  sources:
    # Python (Flask/Django)
    - ".*\\brequest\\.args\\b.*"
    - ".*\\brequest\\.form\\b.*"
    - ".*\\brequest\\.GET\\b.*"
    - ".*\\brequest\\.POST\\b.*"
    # Java (Spring/Servlets)
    - ".*\\bgetParameter\\(.*"
    - ".*\\bgetQueryString\\(.*"
    - ".*\\bgetHeader\\(.*"
    - ".*\\bgetCookies\\(.*"
    - ".*\\bgetValue\\(.*"
    - ".*\\bRequestParam\\b.*"
    - ".*\\bPathVariable\\b.*"
    - ".*\\bRequestBody\\b.*"
    # Node.js
    - ".*\\breq\\.query\\b.*"
    - ".*\\breq\\.body\\b.*"
    - ".*\\breq\\.params\\b.*"
    # PHP
    - ".*\\$_GET\\b.*"
    - ".*\\$_POST\\b.*"
    - ".*\\$_REQUEST\\b.*"
    - ".*\\$_COOKIE\\b.*"
  sinks:
    # SQLi Python
    - pattern: ".*\\bcursor\\.execute\\(.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*\\bdb\\.execute\\(.*"
      subtype: "CWE-89-SQLI"
    # SQLi Java
    - pattern: ".*\\bexecuteQuery\\b.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*\\bexecuteUpdate\\b.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*\\bexecute\\(.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*\\bJdbcTemplate\\.(query|queryForObject|update|execute)\\(.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*\\bEntityManager\\.(createQuery|createNativeQuery)\\(.*"
      subtype: "CWE-89-SQLI"
    # Command Injection Java
    - pattern: ".*\\bRuntime\\.getRuntime\\(\\)\\.exec\\(.*"
      subtype: "CWE-78-COMMAND-INJECTION"
    - pattern: ".*\\bProcessBuilder\\b.*"
      subtype: "CWE-78-COMMAND-INJECTION"
    # Command Injection Python
    - pattern: ".*\\bsubprocess\\.run\\(.*"
      subtype: "CWE-78-COMMAND-INJECTION"
    - pattern: ".*\\bsubprocess\\.Popen\\(.*"
      subtype: "CWE-78-COMMAND-INJECTION"
    - pattern: ".*\\bos\\.system\\(.*"
      subtype: "CWE-78-COMMAND-INJECTION"
    - pattern: ".*\\bos\\.popen\\(.*"
      subtype: "CWE-78-COMMAND-INJECTION"
    # Node.js
    - pattern: ".*\\bconnection\\.query\\(.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*\\bdb\\.query\\(.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*\\bpool\\.query\\(.*"
      subtype: "CWE-89-SQLI"
    # SQLi PHP
    - pattern: ".*\\bmysqli_query\\(.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*->query\\(.*"
      subtype: "CWE-89-SQLI"
    # SQLi ORMs / Query Builders
    - pattern: ".*\\bwhereRaw\\(.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*\\borderByRaw\\(.*"
      subtype: "CWE-89-SQLI"
    - pattern: ".*\\bchild_process\\.(exec|execSync|spawn)\\(.*"
      subtype: "CWE-78-COMMAND-INJECTION"
  sanitizers:
    - ".*\\bescape\\b.*"
    - ".*\\bquote\\b.*"
    # Node.js
    - ".*\\bmysql\\.escape\\(.*"
    - ".*\\.escape\\(.*"
    - ".*\\bparameterized\\b.*"

# KNOWN LIMITATION: arg_index scoping not yet supported by runner.sc
# Taint reaching ANY argument of these calls will currently be reported, not just the URL argument.
# See Fix 5 in remediation notes.
ssrf:
  sources:
    # Python
    - ".*\\brequest\\.args\\b.*"
    - ".*\\brequest\\.form\\b.*"
    # Java
    - ".*\\bgetParameter\\(.*"
    - ".*\\bRequestParam\\b.*"
    - ".*\\bPathVariable\\b.*"
    - ".*\\bRequestBody\\b.*"
    # Node.js
    - ".*\\breq\\.query\\b.*"
    - ".*\\breq\\.body\\b.*"
  sinks:
    # Python HTTP Clients
    - pattern: ".*\\brequests\\.get\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\brequests\\.post\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\burllib\\.request\\.urlopen\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bhttpx\\..*get\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\baiohttp\\..*get\\(.*"
      subtype: "CWE-918-SSRF"
    # Java HTTP Clients
    # KNOWN LIMITATION: these method names are not SSRF-specific in isolation 
    # (openConnection/executeMethod exist in unrelated libraries too). 
    # Residual false positives here are expected to be caught by the LLM 
    # cascade's contextual reasoning stage, not this static layer.
    - pattern: ".*\\bopenConnection\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bexecuteMethod\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bHttpClient\\.execute\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bRestTemplate\\.(getForEntity|postForEntity|exchange|getForObject|postForObject)\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bWebClient\\.create\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bOkHttpClient\\b.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bHttpClient\\..*send\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bImageIO\\.read\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bDocumentBuilder\\..*parse\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bURLClassLoader\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bJsoup\\.connect\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bopenStream\\(.*"
      subtype: "CWE-918-SSRF"
    # Node.js
    - pattern: ".*\\baxios\\.(get|post)\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bfetch\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bhttp\\.get\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bhttps\\.get\\(.*"
      subtype: "CWE-918-SSRF"
    # PHP
    - pattern: ".*\\bfile_get_contents\\(.*"
      subtype: "CWE-918-SSRF"
    - pattern: ".*\\bcurl_setopt\\(.*"
      subtype: "CWE-918-SSRF"
  sanitizers:
    - ".*\\bvalidate_url\\b.*"
    - ".*\\bisAllowedHost\\b.*"
    - ".*\\burlWhitelist\\b.*"
    - ".*\\bisPrivateIP\\b.*"
    - ".*\\bSSRFProtection\\b.*"
    - ".*\\bisBlockedHost\\b.*"

