path_traversal:
  sources:
    # Python
    - ".*\\brequest\\.args\\b.*"
    - ".*\\brequest\\.form\\b.*"
    # Java
    - ".*\\bgetParameter\\(.*"
    - ".*\\bRequestParam\\b.*"
    - ".*\\bPathVariable\\b.*"
    - ".*\\bRequestBody\\b.*"
    # Node.js
    - ".*\\breq\\.query\\b.*"
    - ".*\\breq\\.body\\b.*"
  sinks:
    # Java File Access
    - pattern: ".*\\bgetResourceAsStream\\(.*"
      subtype: "CWE-22-PATH-TRAVERSAL"
    - pattern: ".*\\bFileInputStream\\b.*"
      subtype: "CWE-22-PATH-TRAVERSAL"
    - pattern: ".*\\bnew\\s+File\\(.*"
      subtype: "CWE-22-PATH-TRAVERSAL"
    - pattern: ".*\\bPaths\\.get\\(.*"
      subtype: "CWE-22-PATH-TRAVERSAL"
    - pattern: ".*\\bFileReader\\b.*"
      subtype: "CWE-22-PATH-TRAVERSAL"
    # Python File Access
    - pattern: ".*\\bopen\\(.*"
      subtype: "CWE-22-PATH-TRAVERSAL"
    # Node.js File Access
    - pattern: ".*\\bfs\\.(readFile|readFileSync|createReadStream)\\(.*"
      subtype: "CWE-22-PATH-TRAVERSAL"
  sanitizers:
    # Basic check for path traversal sequences
    - ".*\\bcontains\\(\".*\\.\\./.*\"\\).*"

xxe:
  sources:
    # Java HttpServletRequest InputStreams
    - ".*\\bgetInputStream\\(.*"
    - ".*\\bgetReader\\(.*"
    # Python/Node.js XML parser inputs
    - ".*\\brequest\\.body\\b.*"
    - ".*\\breq\\.body\\b.*"
  sinks:
    # Java XML Parsers
    - pattern: ".*\\bunmarshal\\(.*"
      subtype: "CWE-611-XXE"
    - pattern: ".*\\bSAXParser\\.parse\\(.*"
      subtype: "CWE-611-XXE"
    - pattern: ".*\\bDocumentBuilder\\.parse\\(.*"
      subtype: "CWE-611-XXE"
    - pattern: ".*\\bXMLReader\\.parse\\(.*"
      subtype: "CWE-611-XXE"
    # Python
    - pattern: ".*\\blxml\\.etree\\.parse\\(.*"
      subtype: "CWE-611-XXE"
    - pattern: ".*\\blxml\\.etree\\.fromstring\\(.*"
      subtype: "CWE-611-XXE"
    - pattern: ".*\\bxml\\.etree\\.ElementTree\\.parse\\(.*"
      subtype: "CWE-611-XXE"
    # PHP
    - pattern: ".*\\bsimplexml_load_string\\(.*"
      subtype: "CWE-611-XXE"
    - pattern: ".*\\bloadXML\\(.*"
      subtype: "CWE-611-XXE"
    # Java Others
    - pattern: ".*\\bXMLInputFactory\\.createXMLStreamReader\\(.*"
      subtype: "CWE-611-XXE"
    - pattern: ".*\\bTransformerFactory\\.newTransformer\\(.*"
      subtype: "CWE-611-XXE"
    - pattern: ".*\\bValidator\\.validate\\(.*"
      subtype: "CWE-611-XXE"
  sanitizers:
    # XML parser disabling features
    - ".*\\bsetFeature\\(.*"

csrf:
  sources:
    # Route annotations acting as entry points for state changes
    - ".*\\bPostMapping\\b.*"
    - ".*\\bPutMapping\\b.*"
    - ".*\\bDeleteMapping\\b.*"
    - ".*\\bRequestMapping\\b.*"
    # Or HTTP params explicitly
    - ".*\\bhttp\\b.*"
    - ".*\\bcsrf\\b.*"
    - ".*\\brequest\\b.*"
  sinks:
    # Java Spring Security
    - pattern: ".*\\.csrf\\(\\)\\.disable\\(\\).*"
      subtype: "CWE-352-CSRF"
    - pattern: ".*\\bAbstractHttpConfigurer::disable\\b.*"
      subtype: "CWE-352-CSRF"
    - pattern: ".*\\.csrf\\(.*->.*\\.disable\\(\\)\\).*"
      subtype: "CWE-352-CSRF"
  sanitizers: []

default_credentials:
  sources:
    # Assignment sources for creds
    - ".*\\bpassword\\b.*"
    - ".*\\bSECRET_KEY\\b.*"
    - ".*\\bAPI_KEY\\b.*"
  sinks:
    # Python
    - pattern: ".*\\bpassword\\s*=.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*\\bSECRET_KEY\\s*=.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*\\bAPI_KEY\\s*=.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*mysql\\+pymysql://.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*postgresql://.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*mongodb://.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*redis://.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    # JS
    - pattern: ".*password:\\s*'.*'"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*const\\s+SECRET\\s*=.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*mongoose\\.connect\\(.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    # PHP
    - pattern: ".*\\$password\\s*=.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*define\\('DB_PASSWORD'.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*mysqli_connect\\(.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
    - pattern: ".*new\\s+PDO\\(.*"
      subtype: "CWE-798-HARDCODED-CREDENTIALS"
  sanitizers:
    - ".*\\bos\\.environ\\.get\\(.*"
    - ".*\\bos\\.getenv\\(.*"
    - ".*\\bprocess\\.env\\b.*"
    - ".*\\b\\$_ENV\\b.*"

