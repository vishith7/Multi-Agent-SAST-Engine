cascade:
  tiers:
    - name: tier1_heuristic_gate
      type: rule_based
      action: auto_resolve_obvious_cases

    - name: tier2_fast_llm
      type: llm
      provider: gemini
      model: "gemini-2.5-flash"
      temperature: 0.1
      max_output_tokens: 1200
      applies_to: "confidence_hint != high OR path_length > 5"
      escalate_if:
        verdicts:
          - NEEDS_REVIEW
        confidence_below: 0.70

    - name: tier3_deep_llm
      type: llm
      provider: gemini
      model: "gemini-2.5-flash"
      temperature: 0.1
      max_output_tokens: 2500
      applies_to: "escalated_from_tier2"
      escalate_if:
        confidence_below: 0.60

    - name: tier4_human_review_queue
      type: manual
      applies_to: "escalated_from_tier3"

  budget:
    max_llm_calls_total: 300
    requests_per_minute_limit: 15

    max_llm_calls_per_severity:
      CRITICAL: unlimited
      HIGH: 150
      MEDIUM: 100
      LOW: 50
